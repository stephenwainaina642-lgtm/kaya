# Render Blueprint — deploys Kaya as a single web service (API + built
# frontend served from one Express process) plus a managed Postgres.
#
# Usage: push this repo to GitHub (already done), then in the Render
# dashboard: New -> Blueprint -> pick this repo -> Apply. Render reads this
# file and provisions both resources below automatically.
#
# No manual database setup needed: the start command runs
# scripts/deploy-setup.mjs first, which creates the RLS-scoped kaya_app
# role, pushes the schema, applies row-level-security, and seeds demo data
# on first boot only (it's idempotent — safe on every restart).

databases:
  - name: kaya-db
    plan: free
    databaseName: kaya
    user: kaya

services:
  - type: web
    name: kaya
    runtime: node
    plan: free
    # --include=dev is required here: the service's NODE_ENV=production env
    # var (below) is also present during the build step, and npm treats
    # that as a signal to skip devDependencies — which would silently drop
    # vite, typescript and the @types/* packages the web build needs.
    buildCommand: npm install --include=dev && npm run build -w @kaya/web
    startCommand: node scripts/deploy-setup.mjs && cd apps/api && npx tsx src/server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_ADMIN_URL
        fromDatabase:
          name: kaya-db
          property: connectionString
      - key: APP_DB_PASSWORD
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: PLATFORM_JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://kaya.onrender.com
      - key: LOG_LEVEL
        value: info
      - key: ANTHROPIC_API_KEY
        sync: false # set manually in the Render dashboard (Environment tab) — never stored in this file or in git. Optional: AI features (lead scoring, drafted messages, summaries) are disabled gracefully if unset.
      - key: RESEND_API_KEY
        sync: false # set in the Render dashboard — password-reset emails are not delivered without it
      - key: MAIL_FROM
        sync: false # optional; sender on a domain verified in Resend. Defaults to Resend's sandbox sender.
      - key: S3_BUCKET
        sync: false # bucket name (Cloudflare R2 or AWS S3) — without these, uploads are lost on every deploy

      - key: S3_ENDPOINT
        sync: false # R2: https://<account-id>.r2.cloudflarestorage.com (omit for AWS S3) — without these, uploads are lost on every deploy

      - key: S3_ACCESS_KEY_ID
        sync: false # set in the dashboard — without these, uploads are lost on every deploy

      - key: S3_SECRET_ACCESS_KEY
        sync: false # set in the dashboard — without these, uploads are lost on every deploy
